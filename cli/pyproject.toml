[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkwell"
version = "0.1.5"
description = "On-device eye-fatigue monitor — periodic camera windows, baseline, breaks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  # mediapipe 0.10.30+ bundles a native Clearcut telemetry uploader that
  # attempts network calls; 0.10.21 predates it — pinned hard on purpose.
  "mediapipe==0.10.21",
  # mediapipe pulls opencv-contrib-python (superset providing cv2);
  # installing opencv-python too just fights it for the cv2 package dir.
  "opencv-contrib-python>=4.9,<5",
  "numpy>=1.26,<2",  # mediapipe 0.10.21 requires numpy<2
]

[project.optional-dependencies]
notify = ["plyer>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
blinkwell = "blinkwell.cli:main"

[tool.setuptools.packages.find]
include = ["blinkwell*"]
