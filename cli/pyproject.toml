[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyefd"
version = "0.1.0"
description = "On-device eye-fatigue monitor — local-process port of the web app's analysis pipeline"
requires-python = ">=3.11"
dependencies = [
  "mediapipe>=0.10.14,<0.11",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
notify = ["plyer>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
eyefd = "eyefd.cli:main"

[tool.setuptools.packages.find]
include = ["eyefd*"]
