<!doctype html><html><head><meta charset="utf-8">
<title>blinkwell — history</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--line:#ddd7c9;--ink:#1a1a18;--mut:#77716a;--acc:#e8590c;--acc2:#f4a261}
*{box-sizing:border-box;margin:0;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{background:var(--bg);color:var(--ink);padding:28px;max-width:1080px;margin:0 auto}
h1{font:800 26px ui-sans-serif,system-ui,sans-serif;margin-bottom:4px}
h1 b{color:var(--acc)}
.sub{color:var(--mut);font-size:12px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card .k{font-size:11px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.card .v{font:700 26px ui-sans-serif,system-ui,sans-serif;margin-top:6px}
.card .v small{font-size:13px}
.ctl{display:flex;gap:14px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:20px;flex-wrap:wrap}
.ctl label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.ctl select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:20px}
.panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;font-weight:600}
svg{width:100%;display:block}
.axis{stroke:var(--line);stroke-width:1}
.alab{fill:var(--mut);font-size:10px}
.grid{stroke:#eee8db;stroke-width:1}
.bar{cursor:pointer}
.bar:hover{opacity:.8}
.daysep{stroke:var(--line);stroke-dasharray:3 4}
.tip{position:fixed;background:#2a2822;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;display:none;z-index:9;max-width:280px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:10px;letter-spacing:.08em}
td{padding:7px 10px;border-bottom:1px solid #f0ebdf}
tr:hover td{background:#faf7f0}
.pill{padding:1px 8px;border-radius:99px;font-size:11px}
.empty{color:var(--mut);padding:30px;text-align:center}
</style></head><body>
<h1>blink<b>[well]</b> history</h1>
<div class="sub">local only — generated from __HIST__ · __GEN__</div>
<div class="cards" id="cards"></div>
<div class="ctl">
  <div><label>metric</label><select id="metric">
    <option value="score">fatigue score</option><option value="blinkRate">blink rate /min</option>
    <option value="partial">partial blink %</option><option value="perclos">PERCLOS %</option>
    <option value="blinkMs">mean blink ms</option><option value="reopen">lid reopen %</option>
    <option value="dist">distance cm</option><option value="usable">usable seconds</option>
  </select></div>
  <div><label>group by</label><select id="group">
    <option value="session">each session</option><option value="half">half-day</option><option value="day">day</option>
  </select></div>
  <div><label>range</label><select id="range">
    <option value="7">last 7 days</option><option value="30">last 30 days</option>
    <option value="90">last 90 days</option><option value="0" selected>all time</option>
  </select></div>
</div>
<div class="panel"><h2 id="chartTitle"></h2><svg id="chart" viewBox="0 0 1020 320"></svg></div>
<div class="panel"><h2>sessions</h2><table id="tbl"></table></div>
<div class="tip" id="tip"></div>
<script>
const DATA = __DATA__;
const METRICS={score:{u:'',f:v=>v==null?null:v},blinkRate:{u:'/min'},partial:{u:'%',f:v=>v*100},
perclos:{u:'%',f:v=>v*100},blinkMs:{u:'ms'},reopen:{u:'%',f:v=>v*100},dist:{u:'cm'},usable:{u:'s',f:v=>v/1000}};
const $=id=>document.getElementById(id), tip=$('tip');
function gkey(d,g){const dt=new Date(d);const day=dt.toISOString().slice(0,10);
  return g==='day'?day:g==='half'?day+(dt.getHours()<12?' AM':' PM'):d;}
function glab(k){if(/ AM| PM$/.test(k)){const[d,m]=k.split(' ');return d.slice(5)+' '+m}return k.slice(5)}
function rows(){const r=+$('range').value,cut=r?Date.now()-r*864e5:0;
  return DATA.filter(s=>!cut||new Date(s.t)>cut)}
function val(s,m){const f=METRICS[m].f|| (v=>v);const v=s[m];return v==null?null:f(v)}
function color(v,m){if(m==='score')return v>=60?'#c92a2a':v>=35?'#e8590c':'#2f9e44';return '#e8590c'}
function cards(rs){
 const sc=rs.map(s=>s.score).filter(v=>v!=null);
 const avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null;
 const days=new Set(rs.map(s=>s.t.slice(0,10))).size;
 const best=sc.length?Math.min(...sc):null,worst=sc.length?Math.max(...sc):null;
 $('cards').innerHTML=`
 <div class="card"><div class="k">checks saved</div><div class="v">${rs.length}</div><div class="k" style="margin-top:4px">${days} days</div></div>
 <div class="card"><div class="k">avg fatigue</div><div class="v">${avg?avg.toFixed(0):'—'}<small>/100</small></div></div>
 <div class="card"><div class="k">best</div><div class="v" style="color:#2f9e44">${best??'—'}</div></div>
 <div class="card"><div class="k">worst</div><div class="v" style="color:#c92a2a">${worst??'—'}</div></div>`}
function chart(rs){
 const m=$('metric').value,g=$('group').value,W=1020,H=320,P={l:52,r:14,t:16,b:34};
 const svg=$('chart');svg.innerHTML='';
 const groups=new Map();rs.forEach(s=>{const k=gkey(s.t,g);const v=val(s,m);if(v==null)return;
   (groups.get(k)||groups.set(k,[]).get(k)).push({v,s})});
 const entries=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
 $('chartTitle').textContent=$('metric').selectedOptions[0].text+' · by '+$('group').selectedOptions[0].text.toLowerCase();
 if(!entries.length){svg.innerHTML='<text x="500" y="160" class="alab" text-anchor="middle" font-size="14">no data in range</text>';return}
 const vals=entries.map(e=>e[1].reduce((a,x)=>a+x.v,0)/e[1].length);
 const max=Math.max(...vals)*1.15||1,step=(W-P.l-P.r)/entries.length,bw=Math.min(step*.62,64);
 const y=v=>P.t+(1-v/max)*(H-P.t-P.b);
 for(let i=0;i<=4;i++){const yy=P.t+i*(H-P.t-P.b)/4;const vv=max*(1-i/4);
   svg.innerHTML+=`<line class="grid" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text class="alab" x="${P.l-6}" y="${yy+3}" text-anchor="end">${vv>=10?vv.toFixed(0):vv.toFixed(1)}</text>`}
 let lastDay='';
 entries.forEach(([k,arr],i)=>{
   const v=arr.reduce((a,x)=>a+x.v,0)/arr.length;
   const x=P.l+i*step+(step-bw)/2;
   if(g!=='session'&&k.slice(0,10)!==lastDay){lastDay=k.slice(0,10);
     svg.innerHTML+=`<line class="daysep" x1="${P.l+i*step}" y1="${P.t}" x2="${P.l+i*step}" y2="${H-P.b}"/><text class="alab" x="${P.l+i*step+4}" y="${P.t+10}">${k.slice(5,10)}</text>`}
   const bh=Math.max(2,(H-P.b)-y(v));
   svg.innerHTML+=`<rect class="bar" x="${x}" y="${y(v)}" width="${bw}" height="${bh}" rx="3" fill="${color(v,m)}" data-i="${i}"/>`;
   if(entries.length<=20||i%Math.ceil(entries.length/20)===0)
     svg.innerHTML+=`<text class="alab" x="${x+bw/2}" y="${H-P.b+14}" text-anchor="middle">${g==='session'?new Date(k).getHours()+':'+String(new Date(k).getMinutes()).padStart(2,'0'):glab(k)}</text>`;
 });
 svg.querySelectorAll('.bar').forEach(b=>{
   b.onmousemove=e=>{const[k,arr]=entries[+b.dataset.i];const v=arr.reduce((a,x)=>a+x.v,0)/arr.length;
     tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-10+'px';
     tip.innerHTML=`<b>${val(arr[0].s,'score')!=null?arr[0].s.t.slice(0,16).replace('T',' '):k}</b><br>${$('metric').selectedOptions[0].text}: ${v.toFixed(1)}${METRICS[m].u||''}<br>${arr.length} check${arr.length>1?'s':''}`};
   b.onmouseleave=()=>tip.style.display='none'});
}
function table(rs){
 $('tbl').innerHTML='<tr><th>when</th><th>score</th><th>blinks/min</th><th>partial</th><th>PERCLOS</th><th>blink ms</th><th>reopen</th><th>dist</th><th>usable</th><th>conf</th></tr>'+
 rs.slice().reverse().map(s=>`<tr><td>${s.t.slice(0,16).replace('T',' ')}</td>
 <td><span class="pill" style="background:${s.score>=60?'#ffe3e3':s.score>=35?'#fff0e3':'#e6f4ea'};color:${s.score>=60?'#c92a2a':s.score>=35?'#e8590c':'#2f9e44'}">${s.score??'—'}</span></td>
 <td>${s.blinkRate?.toFixed(1)??'—'}</td><td>${s.partial!=null?(s.partial*100).toFixed(0)+'%':'—'}</td>
 <td>${s.perclos!=null?(s.perclos*100).toFixed(1)+'%':'—'}</td><td>${s.blinkMs?.toFixed(0)??'—'}</td>
 <td>${s.reopen!=null?(s.reopen*100).toFixed(0)+'%':'—'}</td><td>${s.dist?.toFixed(0)??'—'}</td>
 <td>${s.usable!=null?(s.usable/1000).toFixed(0)+'s':'—'}</td><td>${s.conf??''}</td></tr>`).join('')}
function render(){const rs=rows();cards(rs);chart(rs);table(rs)}
['metric','group','range'].forEach(id=>$(id).onchange=render);render();
</script></body></html>
