name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x64,   ext: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-arm64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x64, ext: zip }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc,   name: windows-arm64, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build blinkwell
        run: cargo build --release --manifest-path cli-rs/Cargo.toml --target ${{ matrix.target }}
      - name: Smoke-test `update` plumbing on this OS
        # Exercises the GitHub API call + version compare on every matrix OS.
        # GITHUB_TOKEN avoids the 60/hr unauthenticated rate limit on shared
        # CI egress. Non-blocking: a network flake must never gate a release.
        env:
          BLINKWELL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (./cli-rs/target/${{ matrix.target }}/release/blinkwell update --json || \
           ./cli-rs/target/${{ matrix.target }}/release/blinkwell.exe update --json) || \
          echo "::warning::update smoke test failed — non-blocking"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd cli-rs/target/${{ matrix.target }}/release
          strip blinkwell || true
          tar -czvf $GITHUB_WORKSPACE/blinkwell-${{ matrix.name }}.tar.gz blinkwell
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path cli-rs/target/${{ matrix.target }}/release/blinkwell.exe `
            -DestinationPath blinkwell-${{ matrix.name }}.zip
      - name: Publish release + assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: blinkwell-${{ matrix.name }}.*
      - name: Upload artifact (workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: blinkwell-${{ matrix.name }}
          path: blinkwell-${{ matrix.name }}.*
