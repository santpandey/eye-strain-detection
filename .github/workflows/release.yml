name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x64,   ext: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-arm64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x64, ext: zip }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc,   name: windows-arm64, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build eyefd
        run: cargo build --release --manifest-path cli-rs/Cargo.toml --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd cli-rs/target/${{ matrix.target }}/release
          strip eyefd || true
          tar -czvf $GITHUB_WORKSPACE/eyefd-${{ matrix.name }}.tar.gz eyefd
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path cli-rs/target/${{ matrix.target }}/release/eyefd.exe `
            -DestinationPath eyefd-${{ matrix.name }}.zip
      - name: Publish release + assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: eyefd-${{ matrix.name }}.*
      - name: Upload artifact (workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: eyefd-${{ matrix.name }}
          path: eyefd-${{ matrix.name }}.*
